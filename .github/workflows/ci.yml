name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      # Every action here is pinned by commit SHA: this workflow is audited by
      # the tool it ships, and GHA01 flags a tag ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pattern count sync
        run: python3 tools/check_sync.py
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Self-audit — this repo's own workflows must come back clean
        run: python3 ghaudit.py --repo .
